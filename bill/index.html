<style>
@font-face{font-family:"Pixelify Sans";src:url(fonts/pixelify-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url(fonts/pixelify-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url(fonts/pixelify-sans-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

/*
VOICE: a 90s point-and-click adventure, friendly and funny, for 8-11 year olds.
IDEA: the game screen itself: a room on top, a black dialog panel below, inventory on the right.
PICTURE: the pixel-art room fills the top; characters speak in colored text over their heads.
COLOUR and TYPE: near-black panel, saturated speaker colors, parchment notes; Pixelify Sans for game text, Atkinson Hyperlegible for longer reading.
LAYOUT: landscape-first fixed screen scaled to the window; on a phone held upright the panel stacks under the room.
*/
:root{--u:3px;--px:"Pixelify Sans","Chicago",Geneva,ui-monospace,monospace;--rd:"Atkinson Hyperlegible",ui-rounded,system-ui,sans-serif;
  --bg:#120c22;--panel:#0b0a12;--line:#3a2f5c;--gold:#ffd23f;--hi:#ffe14d;--paper:#f6ebc9;--ink:#2a1a12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--rd)}
body{min-height:100dvh;background-color:#120c22;background-image:radial-gradient(#22183e 1px,transparent 1.3px);background-size:6px 6px;overflow-x:clip}
.hide{display:none!important}
#game{position:relative;width:var(--W,100vw);margin:4px auto 0;border:2px solid #000;box-shadow:0 0 0 2px var(--line),0 10px 40px #0008;background:var(--panel)}
#stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#1d1636;cursor:pointer;line-height:0;user-select:none;-webkit-user-select:none}
.px{position:absolute;inset:0;overflow:hidden;background:#ddd}
.px>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.px img{image-rendering:crisp-edges;image-rendering:pixelated}
.px .room{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.px .spr{position:absolute;transform-origin:50% 100%;width:auto;max-width:none}
/* speech over heads + narrator caption */
#fx{position:absolute;inset:0;pointer-events:none;line-height:1.15}
.say{position:absolute;transform:translateX(-50%);max-width:46%;width:max-content;text-align:center;font:500 max(16px,calc(var(--u)*8.6))/1.12 var(--px);
  text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000,3px 3px 0 #000;animation:pop .18s ease-out}
.say b{color:#fff}
.cap{position:absolute;left:2.5%;right:calc(2.5% + 120px);top:3%;background:#0b0a12e6;border:2px solid #000;box-shadow:0 0 0 2px var(--line);padding:.45em .7em;
  font:400 max(15px,calc(var(--u)*6.8))/1.25 var(--px);color:#fff;animation:pop .18s ease-out}
.cap b{color:var(--hi)}
.more{display:inline-block;margin-left:.35em;color:var(--hi);animation:blink 1s steps(2) infinite;font-size:.8em}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1}}
.cap{animation-name:popc}@keyframes popc{from{opacity:0}to{opacity:1}}
.banner{position:absolute;left:50%;top:20%;transform:translateX(-50%) rotate(-3deg);font:700 max(26px,calc(var(--u)*15))/1 var(--px);color:var(--gold);white-space:nowrap;
  text-shadow:3px 3px 0 #000,-2px 0 #000,0 -2px #000,2px 0 #000,0 2px #000,6px 6px 0 #5a1a40;pointer-events:none;animation:drop .5s cubic-bezier(.3,1.6,.6,1)}
.banner.lose{color:#ff8f8f}.banner.small{font-size:max(18px,calc(var(--u)*8));top:19%;left:4%;transform:rotate(-4deg)}
.banner .logo{display:block;font-size:1.25em}
.banner.title{top:5%}
.banner.end{top:auto;bottom:6%;animation:none}
@keyframes drop{from{transform:translateX(-50%) translateY(-60px) rotate(-3deg);opacity:0}}
.banner.small{animation:none}
.strip{position:absolute;left:2.5%;right:calc(2.5% + 120px);top:3%;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:3px 3px 0 #0008;
  padding:.4em .7em;font:700 max(14px,calc(var(--u)*5.6))/1.25 var(--rd)}
.strip small{display:block;font:500 .75em/1.2 var(--px);color:#7a5a2a;letter-spacing:.02em}
.boards{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none;width:min(92%,560px);justify-content:center}
.board{flex:1;background:#101a10;border:2px solid #000;box-shadow:0 0 0 2px #3c6b3c;padding:6px 8px;font:500 max(13px,calc(var(--u)*4.6))/1.2 var(--px);color:#bff7bf}
.board .tl{display:flex;justify-content:space-between}
.bar{position:relative;height:max(12px,calc(var(--u)*4));background:#5a2020;border:1px solid #000;margin:5px 0}
.bar .yes{position:absolute;left:0;top:0;bottom:0;background:#4fd36b}
.bar .need{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--hi)}
.tn{display:flex;justify-content:space-between}
/* toolbar */
.tools{position:absolute;top:6px;right:6px;display:flex;gap:5px;z-index:3}
.tb{width:34px;height:34px;display:grid;place-items:center;background:#0b0a12d9;border:2px solid #000;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.tb svg{width:20px;height:20px}.tb.off{opacity:.45}
/* panel */
#panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;border-top:3px solid #000;box-shadow:inset 0 2px 0 var(--line);height:var(--P,auto);min-height:var(--Pmin,0)}
#panel.noinv{grid-template-columns:minmax(0,1fr)}
#panel.noinv #inv{display:none}
#dlg{padding:10px 14px 12px;overflow:auto}
#inv{border-left:3px solid #000;box-shadow:inset 2px 0 0 var(--line);padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;width:min(31vw,calc(var(--u)*78));overflow:auto}
.dls{display:flex;flex-direction:column;gap:2px}
.dls.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.dl{display:flex;align-items:center;gap:.5em;width:100%;text-align:left;background:none;border:0;color:#b9a6ff;cursor:pointer;padding:.28em .3em;
  font:500 max(17px,calc(var(--u)*7))/1.2 var(--px);min-height:44px;border-radius:2px}
.dl::before{content:"›";color:#5a4c8a;width:.6em;flex:none}
.dl:hover,.dl:focus-visible{color:#fff;background:#1d1636;outline:none}.dl:hover::before,.dl:focus-visible::before{color:var(--hi)}
.dl small{font:400 .72em var(--px);color:#8d84b0;margin-left:.3em}
.dl .ic{width:1.6em;height:1.6em;flex:none}.dl .ic svg,.dl .ic img{width:100%;height:100%}.pxi{image-rendering:pixelated;object-fit:contain}
.dl.go{color:var(--hi)}.dl.meta{color:#7d74a3;font-size:max(15px,calc(var(--u)*5.2))}
.dl.tipped{color:#fff}.star{color:var(--gold);font-style:normal;margin-right:.3em}
.waiting{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.waiting .dl{width:auto}
.note{background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:.55em .8em;margin:2px 0 10px;font:400 max(15px,calc(var(--u)*5))/1.4 var(--rd);transform:rotate(-.4deg)}
.note b{font-weight:700}
.note .lbl{font:700 1em var(--px);display:inline}
.note.rep .lbl{display:block}
.num{font-family:var(--rd);font-weight:700;letter-spacing:0}
.note.rep ul{list-style:none;padding:0;margin:.3em 0;display:flex;flex-wrap:wrap;gap:2px 10px;font:500 .9em var(--px)}
.note li.ok{color:#2c7a3a}.note li.x{color:#b3261e;font-weight:700}.note li.no{color:#a0957a}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.slot{background:#16122a;border:2px solid #000;box-shadow:inset 0 0 0 2px #2a2250;padding:6px 7px;display:grid;grid-template-columns:auto 1fr;column-gap:6px;row-gap:3px;align-items:center;color:#fff;font-family:var(--px);text-align:left;position:relative}
.slot svg{width:max(22px,calc(var(--u)*7.5));height:max(22px,calc(var(--u)*7.5))}
.slot b{font:700 max(18px,calc(var(--u)*6.6))/1 var(--rd);white-space:nowrap}
.slot small{grid-column:1/-1;font:400 max(11px,calc(var(--u)*3.5))/1.1 var(--px);color:#9c93c4}
button.slot{cursor:pointer}button.slot:hover{box-shadow:inset 0 0 0 2px var(--hi)}
.slot.bump{animation:bump .5s}.slot.bumpd{animation:bumpd .5s}
@keyframes bump{30%{background:#1f4a2a}}@keyframes bumpd{30%{background:#5a1f1f;transform:translateX(-3px)}60%{transform:translateX(3px)}}
.dpop{position:absolute;right:6px;top:-6px;font:700 max(14px,calc(var(--u)*5)) var(--px);text-shadow:2px 2px 0 #000;animation:up 1.4s ease-out forwards;pointer-events:none}
.dpop.up{color:#7dff9a}.dpop.dn{color:#ff8a7a}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
.where{grid-column:1/-1;font:400 max(12px,calc(var(--u)*3.8))/1.3 var(--px);color:#9c93c4}
.where b{color:#fff;font-weight:500}
.dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}.dots i{width:9px;height:9px;background:#2a2250;border:1px solid #000}.dots i.d{background:#4fd36b}.dots i.n{background:var(--hi)}.dots i.x{background:#ff6b5a}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
#nm{flex:1 1 260px;font:700 max(18px,calc(var(--u)*6.4)) var(--rd);padding:.45em .6em;border:2px solid #000;box-shadow:3px 3px 0 #000;background:var(--paper);color:var(--ink);border-radius:0}
#nm:focus{outline:3px solid var(--hi)}
.hintline{font:400 max(13px,calc(var(--u)*4)) var(--px);color:#9c93c4}.err{color:#ff8f8f;font:500 max(14px,calc(var(--u)*4.4)) var(--px);min-height:1.2em}
.sizebar{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.sizebar i{width:10px;height:10px;border:1px solid #000;background:#2a2250}.sizebar i.on{background:var(--hi)}
/* overlay note */
.overlay{position:fixed;inset:0;background:#05040acc;display:none;place-items:center;padding:14px;z-index:20;overflow:auto}
.overlay.show{display:grid}
.dlgx{background:var(--paper);color:var(--ink);border:3px solid #000;box-shadow:6px 6px 0 #000;max-width:560px;width:100%;transform:rotate(-.5deg)}
.dlgx h2{font:700 24px/1.1 var(--px);margin:0;padding:14px 18px 6px}
.dlgb{padding:4px 18px 8px;font-size:17px;line-height:1.45}.dlgb p{margin:0 0 10px}.dlgb ul{padding-left:20px;margin:0 0 10px}
.dlgf{padding:0 18px 16px;text-align:right}
.btn{border:2px solid #000;padding:10px 24px;font:700 18px var(--px);background:#fff;cursor:pointer;box-shadow:3px 3px 0 #000;color:var(--ink)}
.tg{display:flex;gap:8px;align-items:center;font-weight:700;margin:8px 0}.tg input{width:22px;height:22px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:10px;animation:fall 2.6s steps(26) forwards}
@keyframes fall{to{top:110%}}
/* phone held upright: inventory becomes a row above the dialog */
@media (max-aspect-ratio:1/1){
 #game{margin:0;border-left:0;border-right:0}
 #panel{display:flex;flex-direction:column;height:auto}
 #dlg{flex:1}
 #inv{order:-1;width:auto;border-left:0;box-shadow:none;border-bottom:3px solid #000;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px}
 .where{grid-column:1/-1}
 .dls.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cap,.strip{right:2.5%;top:auto;bottom:3%}
}
/* short landscape screens (phones turned sideways): panel beside the room */
#game.side{display:flex;align-items:stretch;height:var(--H)}
#game.side #stage{width:var(--SW);flex:none;align-self:flex-start}
#game.side #panel{display:flex;flex-direction:column;width:var(--PW);height:var(--H);border-top:0;border-left:3px solid #000}
#game.side #inv{order:-1;width:auto;border-left:0;box-shadow:none;border-bottom:3px solid #000;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;gap:5px}
#game.side #dlg{flex:1;padding:6px 10px}
#game.side .tools{right:calc(var(--PW) + 6px)}
#game.side .slot small{display:none}
@media(prefers-reduced-motion:reduce){.say,.cap,.banner,.slot.bump,.slot.bumpd,.dpop{animation:none}}

/* whip count clipboard */
.clip{position:absolute;left:3%;top:15%;width:56%;max-height:82%;overflow:hidden;background:var(--paper);color:#2a1a10;border:calc(var(--u)*1) solid #000;box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 rgba(0,0,0,.5);padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*2.5);font:500 max(11px,calc(var(--u)*5.6))/1.12 var(--px);transform:rotate(-1deg);z-index:3}
.clip:before{content:"";position:absolute;left:50%;top:calc(var(--u)*-3);width:28%;height:calc(var(--u)*5);transform:translateX(-50%);background:#8a8f96;border:calc(var(--u)*.7) solid #000;border-radius:calc(var(--u)*1)}
.clipT{font-weight:700;font-size:1.05em;border-bottom:2px solid #2a1a10;margin-bottom:.25em}
.clip ul{list-style:none;margin:0;padding:0}
.clip li{display:grid;grid-template-columns:4.2em 1fr auto;gap:.4em;align-items:center;padding:.06em 0;border-bottom:1px dashed rgba(42,26,16,.3)}
.clip li b{font-size:.8em;text-align:center;border:1.5px solid #000;padding:0 .2em;color:#fff}
.clip .cy{background:#2f8f46}.clip .cm{background:#c98a14}.clip .cn{background:#b3261e}
.clip em{font-style:normal;font-family:var(--rd);font-size:.85em;color:#6b4a2a}
.clip li.rest span{font-style:italic}
.clipF{margin-top:.35em;font-family:var(--rd);font-size:.9em}
/* newspaper */
.paper{position:absolute;right:4%;top:26%;width:46%;background:#f4f1e6;color:#111;border:calc(var(--u)*1) solid #000;box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 rgba(0,0,0,.5);padding:calc(var(--u)*3);text-align:center;transform:rotate(-4deg);animation:spinin .9s cubic-bezier(.2,.8,.3,1.2);z-index:3}
.paper .mast{font:700 max(10px,calc(var(--u)*4.5))/1 var(--px);letter-spacing:.12em;border-bottom:3px double #111;padding-bottom:.3em;margin-bottom:.35em}
.paper .hl{font:700 max(16px,calc(var(--u)*9))/1.05 var(--px)}
.paper .sub{font:italic 400 max(11px,calc(var(--u)*4.6))/1.2 var(--rd);margin-top:.35em}
@keyframes spinin{from{transform:rotate(-720deg) scale(.05)}to{transform:rotate(-4deg) scale(1)}}
@media (prefers-reduced-motion: reduce){.paper{animation:none}}
/* duel + reasons */
.duelq{font:500 max(13px,calc(var(--u)*4.4))/1.3 var(--px);color:#ffd23f;margin:0 0 6px}
.slot.rsn{grid-column:1/-1;grid-template-columns:1fr}
.rsi{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.rsi i{width:max(20px,calc(var(--u)*7));height:max(20px,calc(var(--u)*7));display:inline-block}
.rsi i svg,.rsi i img{width:100%;height:100%}
.rsi i.bad{opacity:.45}
.rl{list-style:none;padding:0;margin:.3em 0 .8em}
.rli{display:flex;gap:.6em;align-items:flex-start;margin:.35em 0}
.rli .ric{width:30px;height:30px;flex:none}.rli .ric svg,.rli .ric img{width:100%;height:100%}
.rli.dim{opacity:.6}.rli em.no{color:#b3261e;font-style:normal;font-weight:700}
</style>

{
/* EB config: on the live site set home to "/" */
const EB={id:"bill",home:"../"};
const bar=document.currentScript.previousElementSibling;
const url=EB.home+"#"+EB.id;
const mts=bar.querySelectorAll(".eb-mt");
const closeAll=()=>mts.forEach(m=>m.setAttribute("aria-expanded","false"));
mts.forEach(m=>m.addEventListener("click",e=>{e.stopPropagation();const o=m.getAttribute("aria-expanded")==="true";closeAll();if(!o)m.setAttribute("aria-expanded","true")}));
document.addEventListener("click",closeAll);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
let busy=false;
bar.querySelectorAll(".eb-go").forEach(a=>{
  a.href=url;
  a.addEventListener("click",e=>{
    e.stopPropagation();
    if(a.dataset.go){delete a.dataset.go;return}
    e.preventDefault();closeAll();if(busy)return;busy=true;
    const done=()=>{busy=false;a.dataset.go="1";a.click()};
    if(matchMedia("(prefers-reduced-motion: reduce)").matches)return done();
    const W=innerWidth,H=innerHeight,N=7,boxes=[];
    for(let i=0;i<N;i++)setTimeout(()=>{
      const p=i/(N-1),w=W*(1-p)+40*p,h=H*(1-p)+30*p;
      const z=document.createElement("div");z.className="eb-z";
      Object.assign(z.style,{left:(W-w)/2+"px",top:(H-h)/2+"px",width:w+"px",height:h+"px"});
      document.body.appendChild(z);boxes.push(z);if(boxes.length>3)boxes.shift().remove();
      if(i===N-1)setTimeout(()=>{boxes.forEach(b=>b.remove());done()},60);
    },i*38);
  });
});
}

<script>
/* ===== Bill's Big Trip — game logic ===== */
(()=>{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- sound + voice ---------- */
let AC=null,soundOn=store.get("bbt-sound",true),readOn=false;
function tone(f,d=.1,type="square",vol=.05,when=0){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={tap:()=>tone(660,.06),good:()=>{tone(523,.1);tone(659,.1,"square",.05,.1);tone(784,.16,"square",.05,.2)},bad:()=>{tone(220,.18,"sawtooth",.04);tone(180,.25,"sawtooth",.04,.15)},
  law:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.16,"triangle",.07,i*.13)),tick:()=>tone(1200,.02,"square",.02),stamp:()=>{tone(90,.2,"sawtooth",.08)}};
function say(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g," "));u.rate=.95;speechSynthesis.speak(u)}
function hush(){if("speechSynthesis" in window)speechSynthesis.cancel()}

/* ---------- data ---------- */
const FOODS=[
 {id:"pizza",n:"pizza",day:"Pizza",or:"flatbread",pk:"thin crust only",pkSay:"Pizza must be thin crust. Thick crust is too much!",other:"deep dish",veg:true},
 {id:"pancakes",n:"pancakes",day:"Pancake",or:"waffles",pk:"real maple syrup only",pkSay:"Pancakes must have real maple syrup. Nothing else!",other:"any syrup",veg:true},
 {id:"tacos",n:"tacos",day:"Taco",or:"burritos",pk:"hard shells only",pkSay:"Tacos must have hard shells. Crunch is the law!",other:"soft shells",veg:true},
 {id:"apples",n:"apples",day:"Apple",or:"pears",pk:"red apples only",pkSay:"Only red apples count. Green apples are too sour!",other:"green apples",veg:false},
 {id:"curds",n:"cheese curds",day:"Cheese Curd",or:"string cheese",pk:"they must squeak",pkSay:"Cheese curds must squeak when you bite them!",other:"quiet curds",veg:true},
 {id:"mac",n:"mac and cheese",day:"Mac and Cheese",or:"buttered noodles",pk:"baked only, no boxes",pkSay:"Mac and cheese must be baked. No boxes allowed!",other:"the boxed kind",veg:true},
 {id:"pickles",n:"pickles",day:"Pickle",or:"cucumbers",pk:"dill only",pkSay:"Only dill pickles. Sweet pickles are not pickles!",other:"sweet pickles",veg:false},
 {id:"broccoli",n:"broccoli",day:"Broccoli",or:"cauliflower",pk:"steamed only",pkSay:"Broccoli must be steamed. No mushy boiled broccoli!",other:"boiled broccoli",veg:false}
];
const KINDS=[{id:"official",w:1,label:"Official national food"},{id:"holiday",w:1,label:"A national day for it"},{id:"school",w:2,label:"A school lunch rule"},{id:"rest",w:3,label:"Every restaurant must serve it"}];
const WHERES=[{id:"country",w:0,label:"The whole country"},{id:"schools",w:0,label:"Only at schools"},{id:"fridays",w:-1,label:"Only on Fridays"}];
const TWISTS=[{id:"none",w:0,label:"No twist"},{id:"samples",w:2,label:"Free samples for everyone"},{id:"pine",w:1,label:"Ban pineapple forever"},{id:"parade",w:1,label:"With a parade"}];
const QUICK=[
 {id:"pizza",t:"Pizza Power",b:{food:"pizza",kind:"official",where:"country",twist:"none"},title:"The Pizza Power Act"},
 {id:"pancakes",t:"Pancake Day",b:{food:"pancakes",kind:"holiday",where:"country",twist:"none"},title:"The Pancake Day Act"},
 {id:"pickles",t:"Pickle Lunch",b:{food:"pickles",kind:"school",where:"country",twist:"none"},title:"The Pickle Lunch Act"},
 {id:"tacos",t:"Tacos Everywhere",b:{food:"tacos",kind:"rest",where:"country",twist:"none"},title:"The Tacos Everywhere Act"}
];
const ADJ=["Mighty","Super","Great","Happy","Tasty","Brave","Big","Glorious","Yummy","Marvelous","Amazing","Snack-tastic"];
const PEOPLE={
 saucer:"Rep. Penny Saucer",crust:"Rep. Crustworthy",green:"Rep. Kale Greenleaf",dente:"Rep. Al Dente",gouda:"Rep. Gouda",
 middle:"Rep. Middleton",ketchum:"Rep. Ketchum",topp:"Rep. Toppington",longwind:"Sen. Longwind",vp:"The Vice President",
 nickel:"Sen. Nickelby",harvest:"Sen. Harvest",lark:"Sen. Lark",staffer:"Skip",farmer:"A farmer",lunch:"A school lunch cook",
 chef:"The White House chef",kid:"You",clerk:"The bill clerk",pres:"The President",sgreen:"Sen. Greenleaf",reporter:"A reporter",blogger:"A food blogger"
};
const MODES={
 easy:{name:"Easy",nick:"Junior Page",days:0,start:4,events:[0,0],cards:0,
   queue:["sponsor","house","svote","president"]},
 normal:{name:"Normal",nick:"Staffer",days:65,start:0,events:[2,3],cards:2,
   queue:["sponsor","hopper","committee","hearing","markup","house","senate","svote","match","president"]},
 hard:{name:"Hard",nick:"Capitol Pro",days:55,start:-1,events:[3,4],cards:3,
   queue:["sponsor","hopper","committee","hearing","markup","house","senate","filibuster","svote","conference","president"]}
};
const ROUTE={sponsor:"Sponsor",hopper:"Hopper",committee:"Committee",hearing:"Hearing",markup:"Markup",house:"House vote",senate:"Senate",filibuster:"Filibuster",svote:"Senate vote",match:"Match",conference:"Conference",president:"President",override:"Override"};
const LONG={sponsor:"finding a sponsor",hopper:"the hopper",committee:"the committee",hearing:"the hearing",markup:"the markup",house:"the House vote",senate:"the Senate",filibuster:"the filibuster",svote:"the Senate vote",match:"making the versions match",conference:"the conference committee",president:"the President's desk",override:"the override vote"};

/* ---------- state ---------- */
let S=null;
const food=()=>FOODS.find(f=>f.id===S.bill.food);
function sizeOf(b){return Math.max(0,KINDS.find(k=>k.id===b.kind).w+WHERES.find(k=>k.id===b.where).w+TWISTS.find(k=>k.id===b.twist).w)}
function sizeWord(n){return n<=1?"Small":n<=3?"Medium":n<=5?"Big":"Huge"}
function startFriends(size){return size<=1?7:size<=3?5:size<=5?3:1}
function billSentence(b,mods){
  const f=FOODS.find(x=>x.id===b.food);const fn=(mods&&mods.ketchup)?"ketchup":f.n;const dn=(mods&&mods.ketchup)?"Ketchup":f.day;
  let s;
  if(b.kind==="official")s=`Make ${fn} the official national ${(mods&&mods.snack)?"snack":"food"}`;
  else if(b.kind==="holiday")s=`Make a national ${dn} Day${(mods&&mods.snack)?" (just a half day)":""}`;
  else if(b.kind==="school")s=`Serve ${fn} at every school lunch${(mods&&mods.snack)?", once a week":""}`;
  else s=`Every restaurant must serve ${fn}${(mods&&mods.snack)?" (if they already sell food like it)":""}`;
  if(b.where==="country")s+=b.kind==="official"||b.kind==="holiday"?" for the whole country":" across the country";
  else if(b.where==="schools"&&b.kind!=="school")s+=" at schools";
  else if(b.where==="fridays")s+=", on Fridays only";
  if(b.twist==="samples")s+=", with free samples for everyone";
  if(b.twist==="pine")s+=", and ban pineapple forever";
  if(b.twist==="parade")s+=", with a parade";
  if(mods){if(mods.picky)s+=` (${f.pk})`;if(mods.veg)s+=f.veg?", with a vegetable on top":", with melted cheese on top";if(mods.or)s+=` (or ${f.or})`;if(mods.and)s+=` (and ${mods.and})`;if(mods.study)s+=", plus a big study about it";if(mods.deals)s+=` (plus ${mods.deals} small change${mods.deals>1?"s":""} from deals)`}
  return s+".";
}
function billText(){if(S.slices<=0&&S.swapped)return S.swapped;return billSentence(S.bill,S.mods)}

function newGame(mode,bill,title){
  const M=MODES[mode],size=sizeOf(bill);
  S={v:2,mode,bill,title,size,friends:0,lm:startStances(mode,bill),args:startArgs(bill),learn:{},quick:0,days:M.days,daysStart:M.days,slices:5,
     queue:M.queue.slice(),i:0,mods:{},flags:{},num:1000+Math.floor(Math.random()*8999),congress:1,reached:[],
     amend:[],eventsLeft:[],evSlots:[],sub:0,ended:null,swapped:null,hint:false};
  const n=M.events[0]+Math.floor(Math.random()*(M.events[1]-M.events[0]+1));
  const slots=shuffle([...Array(S.queue.length-1).keys()].map(x=>x+1)).slice(0,n);
  S.evSlots=slots;S.eventsLeft=shuffle(EVENTS.map(e=>e.id));syncFriends();
  save();
}
function save(){if(S)store.set("bbt-save",S)}
const cur=()=>S.queue[S.i];

/* ---------- lawmakers ---------- */
// v = how many votes each lawmaker's group brings. House leaders bring their followers; senators bring a few friends.
const LM={
 saucer:{ch:"H",v:12},crust:{ch:"H",v:18,com:1},green:{ch:"H",v:22,com:1},dente:{ch:"H",v:14},gouda:{ch:"H",v:16,com:1},
 topp:{ch:"H",v:14,com:1},middle:{ch:"H",v:24,com:1},ketchum:{ch:"H",v:10},
 sgreen:{ch:"S",v:5},longwind:{ch:"S",v:6},nickel:{ch:"S",v:5},harvest:{ch:"S",v:5},lark:{ch:"S",v:5}
};
const HOUSE=Object.keys(LM).filter(k=>LM[k].ch==="H"),SENATE=Object.keys(LM).filter(k=>LM[k].ch==="S"),COMM=Object.keys(LM).filter(k=>LM[k].com);
const VEG=["apples","broccoli","pickles"];
const cap=s=>s[0].toUpperCase()+s.slice(1);
function costOK(b,mods){return["official","holiday"].includes(b.kind)&&["none","pine"].includes(b.twist)&&!(mods&&mods.study)}
function lean(id,b){const f=b.food,sz=sizeOf(b);
  switch(id){
   case"crust":return sz>=4?-1:sz<=1?1:0;
   case"green":case"sgreen":return VEG.includes(f)?1:b.kind==="school"?-1:0;
   case"gouda":return["curds","mac","pizza"].includes(f)?1:0;
   case"topp":return b.twist==="pine"?-1:["pizza","tacos"].includes(f)?1:0;
   case"middle":return sz>=3?-1:b.where==="fridays"?1:0;
   case"ketchum":return b.twist==="parade"||b.kind==="holiday"?1:f==="broccoli"?-1:0;
   case"longwind":return sz>=3?-1:["apples","pancakes"].includes(f)?1:0;
   case"nickel":return costOK(b)?(b.twist==="none"?1:0):-1;
   case"harvest":return["apples","broccoli","pickles","curds"].includes(f)?1:0;
   case"lark":return b.twist==="pine"?-1:["school","holiday"].includes(b.kind)?1:0;
  }return 0}
// stance: 0 = no, 1 = maybe, 2 = yes
function startStances(mode,b){const o={};Object.keys(LM).forEach(id=>{let l=lean(id,b);
  if(mode==="easy")l+=1;if(mode==="hard"&&l>0)l=0;
  o[id]=id==="saucer"?1:clamp(l+1,0,2)});
  if(mode==="hard")o.longwind=0;return o}
function syncFriends(){if(S&&S.lm)S.friends=Object.keys(LM).filter(id=>S.lm[id]===2).length}
const HOUSESTOPS=["sponsor","hopper","committee","hearing","markup","house"],SENSTOPS=["senate","filibuster","svote"];
function chamberNow(){const q=S.queue[S.i];return HOUSESTOPS.includes(q)?HOUSE:SENSTOPS.includes(q)?SENATE:Object.keys(LM)}
function nudge(n){const ids=chamberNow().filter(i=>i!=="saucer");for(let k=0;k<Math.abs(n);k++){
  if(n>0){const m=shuffle(ids.filter(i=>S.lm[i]===1))[0]||shuffle(ids.filter(i=>S.lm[i]===0))[0];if(m)S.lm[m]++}
  else{const y=shuffle(ids.filter(i=>S.lm[i]===2))[0]||shuffle(ids.filter(i=>S.lm[i]===1))[0];if(y)S.lm[y]--}}
  syncFriends()}

/* ---------- vote math ---------- */
const HBASE=()=>Math.max(80,150-8*S.size+(S.mode==="easy"?25:0)-(S.mode==="hard"?5:0));
const SBASE=()=>Math.max(15,40-2*S.size+(S.mode==="easy"?6:0)-(S.mode==="hard"?2:0));
function count(ch){const ids=ch==="H"?HOUSE:SENATE;let sure=ch==="H"?HBASE():SBASE(),maybe=0;ids.forEach(id=>{if(S.lm[id]===2)sure+=LM[id].v;else if(S.lm[id]===1)maybe+=LM[id].v});return{sure,maybe}}
function rollVotes(ch,extra=0){const c=count(ch),p=S.mode==="hard"?.3:S.mode==="easy"?.6:.4;let y=c.sure+extra;
  (ch==="H"?HOUSE:SENATE).forEach(id=>{if(S.lm[id]===1)y+=LM[id].v*clamp(p+rnd(-.25,.25),0,1)});
  return clamp(Math.round(y+(ch==="H"?rnd(-4,4):rnd(-1,1))),0,ch==="H"?435:100)}
const comNeed=()=>S.size>=4||S.mode==="hard"?4:3;
function comCount(){let y=0,m=0;COMM.forEach(id=>{if(S.lm[id]===2)y++;else if(S.lm[id]===1)m++});return{y,m}}

/* ---------- reasons ---------- */
const RS={
 kids:{n:"Kids want it",src:"your own letter, or letters from kids"},
 poll:{n:"Lots of people want it",src:"signatures, a news story, or the library"},
 farms:{n:"It helps farmers",src:"a farmer at the hearing, or the library"},
 health:{n:"It can be healthy",src:"the school lunch cook at the hearing"},
 cost:{n:"It costs very little",src:"keeping your bill small and cheap"},
 tradition:{n:"An old favorite",src:"the chef at the hearing, or the library"},
 home:{n:"Every state loves it",src:"letters from kids in many states, or the library"},
 fun:{n:"It's fun!",src:"a parade, a national day, or a news story"}
};
const RORDER=["kids","poll","farms","health","cost","tradition","home","fun"];
function rsay(t){const f=food();return{
 kids:"Kids all over the country want this. Here are their letters!",
 poll:"We asked lots of people. Most of them like this idea!",
 farms:`Farmers grow what goes into ${f.n}. This helps them!`,
 health:`${cap(f.n)} can be part of a healthy meal.`,
 cost:"This law costs almost no tax money.",
 tradition:`People here have enjoyed ${f.n} for a long, long time.`,
 home:`People in every state love ${f.n}, including yours!`,
 fun:"It would make people smile. Everybody needs some fun!"}[t]}
function rvalid(t){if(t==="health")return VEG.includes(S.bill.food)||!!S.mods.veg;if(t==="cost")return costOK(S.bill,S.mods);return true}
function whyFalse(t){
  if(t==="health")return`Healthy? ${cap(food().n)}? Every day? I don't think so!`;
  if(S.mods.study)return"Cheap? That big study costs a lot of money!";
  if(S.bill.twist==="samples")return"Cheap? Free samples for EVERYONE? Somebody pays for those!";
  if(S.bill.twist==="parade")return"Cheap? Parades cost money!";
  return S.bill.kind==="school"?"Cheap? Schools would have to pay for all that food!":"Cheap? Restaurants would have to pay for this!"}
function gain(t){if(!S.args.includes(t)){S.args.push(t);S.args.sort((a,b)=>RORDER.indexOf(a)-RORDER.indexOf(b))}}
function startArgs(b){const a=["kids"];if(b.twist==="parade"||b.kind==="holiday")a.push("fun");if(costOK(b))a.push("cost");return a}
const RICON={
 kids:`<svg viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="11" fill="#fff8e0" stroke="#000"/><path d="M2 5l8 6 8-6" fill="none" stroke="#000"/><path d="M10 14.5l-2.6-2.4a1.5 1.5 0 0 1 2.6-1.4 1.5 1.5 0 0 1 2.6 1.4z" fill="#c8102e"/></svg>`,
 poll:`<svg viewBox="0 0 20 20"><rect x="4" y="3" width="12" height="15" fill="#fff" stroke="#000"/><rect x="7.5" y="1.5" width="5" height="3" fill="#888" stroke="#000"/><circle cx="10" cy="11" r="4.2" fill="#24548a" stroke="#000"/><path d="M10 11V6.8A4.2 4.2 0 0 1 14 9.6z" fill="#f4c542" stroke="#000"/></svg>`,
 farms:`<svg viewBox="0 0 20 20"><rect x="3" y="8" width="9" height="5" fill="#c8102e" stroke="#000"/><rect x="8" y="4" width="4" height="4" fill="#9cc9f0" stroke="#000"/><circle cx="6" cy="15" r="3" fill="#333" stroke="#000"/><circle cx="15" cy="15.5" r="2" fill="#333" stroke="#000"/><path d="M12 10h4v4" fill="#c8102e" stroke="#000"/></svg>`,
 health:`<svg viewBox="0 0 20 20"><path d="M10 5q-6-3-7 4t7 9q8-2 7-9t-7-4z" fill="#7bc142" stroke="#000"/><path d="M10 5q0-3 3-4" fill="none" stroke="#000"/><path d="M10 8.5v6M7 11.5h6" stroke="#fff" stroke-width="2"/></svg>`,
 cost:`<svg viewBox="0 0 20 20"><path d="M4 9q0-5 6-5t6 5v5q0 3-6 3t-6-3z" fill="#8b5a2b" stroke="#000"/><circle cx="7" cy="5" r="2.4" fill="#f4c542" stroke="#000"/><circle cx="12.5" cy="4" r="2.4" fill="#f4c542" stroke="#000"/></svg>`,
 tradition:`<svg viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="9" rx="1" fill="#f3e6c8" stroke="#000"/><path d="M5 9h10M5 12h7" stroke="#8b5a2b"/><path d="M3 10.5h14" stroke="#c8102e" stroke-width="1.6"/></svg>`,
 home:`<svg viewBox="0 0 20 20"><path d="M10 18q-6-7-6-11a6 6 0 0 1 12 0q0 4-6 11z" fill="#c8102e" stroke="#000"/><circle cx="10" cy="7" r="2.2" fill="#fff" stroke="#000"/></svg>`,
 fun:`<svg viewBox="0 0 20 20"><ellipse cx="10" cy="7" rx="7" ry="2.5" fill="#fff" stroke="#000"/><path d="M3 7v6q7 5 14 0V7" fill="#c8102e" stroke="#000"/><path d="M5 9l3 6M9 9.5l3 6M13 9l2 4" stroke="#f4c542"/><path d="M6 1l3 5M15 1l-3 5" stroke="#8b5a2b" stroke-width="1.5"/></svg>`
};
const ricon=t=>ART.has("arg-"+t)?`<img class="pxi" src="art/arg-${t}.png" alt="">`:RICON[t];

/* ---------- objections: what each lawmaker asks ---------- */
const OBJ={
 saucer:[{q:"Congress is very busy. Does anybody really want this?",a:["poll","kids"]},{q:"Why should I put my name on a food bill?",a:["kids","poll","farms","home","tradition"]},{q:"Will it cost a lot?",a:["cost"]}],
 crust:[{q:"My committee gets hundreds of bills. Why should yours get a hearing?",a:["poll","kids"]},{q:"And who pays for all this?",a:["cost"]},{q:"Does it help anybody's job?",a:["farms"]}],
 green:[{q:"Is it good for growing bodies?",a:["health"]},{q:"Would kids actually eat it?",a:["kids","poll"]},{q:"Does it help the people who grow our food?",a:["farms"]}],
 sgreen:[{q:"My cousin always asks this, and so do I. Is it healthy?",a:["health"]},{q:"Does it help the people who grow our food?",a:["farms"]},{q:"Would kids like it?",a:["kids"]}],
 dente:[{q:"What's in it for the folks in my state?",a:["home","farms"]},{q:"Why should I care? I'm a noodle guy!",a:["tradition","fun"]},{q:"Do people even want it?",a:["poll"]}],
 gouda:[{q:"What does this do for the people back home?",a:["home","farms"]},{q:"Is it really a national favorite?",a:["tradition","poll"]},{q:"Is it good for kids?",a:["kids","health"]}],
 topp:[{q:"Will people like it, or just grumble?",a:["poll","fun"]},{q:"Isn't there something more important to do?",a:["kids","home"]},{q:"Does it cost a lot?",a:["cost"]}],

function presOutcome(lead){
  let p=.05;const why=[];

   if(S.bill.twist==="pine"){p+=.4;why.push("pineapple")}
   if(S.slices<=1){p+=.55;why.push("changes")}
   if(S.size>=4){p+=.15;why.push("big")}
   if(S.mods.study){p+=.2;why.push("study")}
   if(S.mods.ketchup){p+=.15}
   if(S.flags.letters)p-=.2;if(S.flags.chef===1)p-=.15;if(S.flags.chef===-1)p+=.15;
   p=clamp(p,0,.9)}
  if(Math.random()<p){
    S.vetoWhy=why[0]||"plain";

function apply(fx){if(!fx)return;const d=fx.d||0;if(S.mode!=="easy"&&d)S.days=Math.max(0,S.days+d);if(fx.fr&&!fx.noNudge)nudge(fx.fr);if(fx.sl)S.slices=clamp(S.slices+fx.sl,0,5)}

function END(id,o={}){return{kind:"end",id,...o}}

function render(){
  hush();renderHUD();
  if(!S)return title();
  if(S.ended)return showEnd(S.ended);
  if(S.inter)return showInter(S.inter);
  const id=cur();if(!id)return;
  if(!S.reached.includes(id))S.reached.push(id);
  const c=STOP(id);showCard(c,id);save();
}
function next(){
  S._stay=0;S.quick=0;S.hint=false;
  if(S.mode!=="easy"&&S.days<=0){S.ended={id:"out"};return render()}
  if(S.slices<=0&&!S.swapped){S.inter="swap";return render()}
  const done=S.queue[S.i];
  S.i++;
  if(S.i>=S.queue.length){return render()}
  if((S.mode==="easy"?["house"]:["hopper","markup","house","filibuster","svote"]).includes(done)){S.inter="news:"+done;save();return render()}
  afterNews();
}
function afterNews(){
  if(S.evSlots.includes(S.i)&&S.eventsLeft.length){S.evSlots=S.evSlots.filter(x=>x!==S.i);
    const evs=S.eventsLeft.map(id=>EVENTS.find(e=>e.id===id)).filter(e=>!e.need||e.need(S));
    if(evs.length){const e=evs[0];S.eventsLeft=S.eventsLeft.filter(x=>x!==e.id);S.inter="ev:"+e.id;return render()}}
  render();
}

/* turn a result paragraph into lines: text in quotes is spoken by `who`, the rest is narration */
function parseLines(txt,who){
  const out=[];const t=String(txt).replace(/<br\s*\/?>/g," ");
  const parts=t.split(/"([^"]+)"/);
  parts.forEach((p,i)=>{p=p.trim();if(!p)return;
    const sp=i%2?(who||"nar"):"nar";
    const sents=p.match(/[^.!?]+[.!?)]*["']?\s*|.+$/g)||[p];let buf="";
    sents.forEach(s=>{if((buf+s).length>120&&buf){out.push({who:sp,t:buf.trim()});buf=""}buf+=s});
    if(buf.trim())out.push({who:sp,t:buf.trim()})});
  // drop dangling narration like "says Rep. X." that only names the speaker
  return out.filter(l=>!(l.who==="nar"&&/^(says|asks)\b/i.test(stripTags(l.t))&&l.t.length<40));
}

function showLine(){

  const a=l.who==="bill"?SC.anch.B:(l.who===SC.who&&l.who!=="nar"?SC.anch.L:null);

}
function advance(){
  if(!LINES.length)return;

  if(AFTER){const a=AFTER;AFTER=null;a()}
}
function skipLines(){if(!LINES.length)return;LI=LINES.length-1;showLine();if(AFTER){const a=AFTER;AFTER=null;a()}}
function waitPanel(){
  if(LINES.length<=1){if(AFTER){const a=AFTER;AFTER=null;a()}return}
  $("#dlg").innerHTML=`<div class="waiting"><button class="dl go" id="nx">Next</button>${LINES.length>2?`<button class="dl meta" id="sk">Skip to the choices</button>`:""}</div>`;

/* choices in the panel */
function choices(list,o={}){
  const showTip=S&&(S.mode==="easy"||S.hint||window.__allTips);
  const rows=list.map((c,i)=>`<button class="dl ${c.cls||""}${showTip&&c.tip?" tipped":""}" data-i="${i}">${c.icon?`<span class="ic">${c.icon}</span>`:""}<span>${showTip&&c.tip?'<i class="star" title="Rep. Saucer\'s tip">★</i>':""}${numfix(esc(c.l))}${c.sub?`<small>(${numfix(esc(c.sub))})</small>`:""}</span></button>`).join("");
  $("#dlg").innerHTML=numfix(o.top||"")+`<div class="dls${o.grid?" grid2":""}">${rows}</div>`+(o.bottom||"");
  $("#dlg").scrollTop=0;

function pie(n,fid){let s=`<svg viewBox="-22 -22 44 44" aria-hidden="true">`;for(let k=0;k<5;k++){const a0=-Math.PI/2+k*2*Math.PI/5,a1=a0+2*Math.PI/5;const x0=20*Math.cos(a0),y0=20*Math.sin(a0),x1=20*Math.cos(a1),y1=20*Math.sin(a1);
  s+=`<path d="M0 0L${x0.toFixed(2)} ${y0.toFixed(2)}A20 20 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${k<n?(fid==="pizza"?"#f4c542":"#e9a23b"):"#2a2250"}" stroke="#000" stroke-width="1.5"/>`;if(k<n&&fid==="pizza"){const m=(a0+a1)/2;s+=`<circle cx="${(11*Math.cos(m)).toFixed(1)}" cy="${(11*Math.sin(m)).toFixed(1)}" r="3" fill="#c8102e"/>`}}

function bump(fx){if(!fx)return;[["fr","#m-fr"],["d","#m-d"],["sl","#m-sl"]].forEach(([k,sel])=>{const v=fx[k];if(!v||(k==="d"&&S.mode==="easy"))return;const el=$(sel);if(!el)return;
  el.classList.remove("bump","bumpd");void el.offsetWidth;el.classList.add(v>0?"bump":"bumpd");
  const p=document.createElement("span");p.className="dpop "+(v>0?"up":"dn");p.textContent=(v>0?"+":"")+v;el.appendChild(p);setTimeout(()=>p.remove(),1500)})}
function boardsHTML(ts){if(!ts||!ts.length)return"";return`<div class="boards">${ts.map(t=>{const tot=t.y+t.n,pct=v=>(v/tot*100).toFixed(1);

function animBoards(){document.querySelectorAll(".board").forEach(el=>{const y=+el.dataset.y,n=+el.dataset.n,tot=y+n;let k=0;const steps=26;

function showResult(r,c){

  hush();S=null;renderHUD();BMODE=mode||BMODE;B={food:"pizza",kind:"official",where:"country",twist:"none"};BSTEP="start";bstep();
}
function bgo(step){BSTEP=step;bstep()}
function bstep(){
  const strip=bstrip();stageSet("office","staffer","happy",{strip});
  const back=prev=>({l:"Go back",cls:"meta",go:()=>bgo(prev)});
  const L=(t,who="staffer")=>({who,t});
  if(BSTEP==="start"){
    play([L("Hi! I'm Skip. I work for Rep. Penny Saucer."),L("She's in a meeting. While you wait, let's write down your idea."),L("Every law starts as an idea. What's yours?")],()=>choices([
      ...QUICK.map(q=>({l:`${q.t}`,sub:"ready-made",icon:FOODICON[q.b.food],go:()=>{B=Object.assign({},q.b);B._title=q.title;bgo("review")}})),
      {l:"I want to build my own!",cls:"go",go:()=>bgo("food")},{l:"Back to the title screen",cls:"meta",go:title}]))}
  else if(BSTEP==="food"){
    play([L("Ooh, your own bill! What food is it about?")],()=>choices([...FOODS.map(f=>({l:f.n,icon:FOODICON[f.id],go:()=>{B.food=f.id;bgo("kind")}})),back("start")],{grid:true}))}
  else if(BSTEP==="kind"){
    const f=FOODS.find(x=>x.id===B.food);
    play([L(`${f.n[0].toUpperCase()+f.n.slice(1)}! Great choice.`),L("What should the law do? Bigger laws are harder to pass.")],()=>choices([...KINDS.map(k=>({l:KINDSAY[k.id],sub:dots(k.w),go:()=>{B.kind=k.id;bgo("where")}})),back("food")]))}
  else if(BSTEP==="where"){
    play([L("Where should the law count?")],()=>choices([...WHERES.map(k=>({l:WHERESAY[k.id],sub:dots(k.w),go:()=>{B.where=k.id;bgo("twist")}})),back("kind")]))}
  else if(BSTEP==="twist"){
    play([L("Want to add a twist? Twists are fun, but they make a bill bigger.")],()=>choices([...TWISTS.map(k=>({l:TWISTSAY[k.id],sub:dots(k.w),go:()=>{B.twist=k.id;bgo("review")}})),back("where")]))}
  else if(BSTEP==="review"){
    const sz=sizeOf(B);const c={0:"A small bill. Lawmakers will like that!",1:"A small bill. Lawmakers will like that!",2:"A medium bill. We'll need some friends.",3:"A medium bill. We'll need some friends.",4:"A big bill! We'll have to make deals.",5:"A big bill! We'll have to make deals."}[sz]||"A HUGE bill! This will be really hard. Are you sure?";
    play([L("That's me! I'm a bill now!","bill"),L(c),...(BSTEP==="review"?[L("Rep. Saucer will be out soon. You'll have to convince her!")]:[])],()=>choices([{l:"Yes! Let's name it",cls:"go",go:()=>bgo("name")},{l:"Change something",go:()=>bgo("food")},{l:"Start over",cls:"meta",go:()=>bgo("start")}]))}
  else if(BSTEP==="name"){
    const typing=store.get("ef-bill-typing",true);let name=B._title||genName();
    play([L("Real laws have catchy names. What should we call yours?")],()=>{
      choices([{l:"Make one up for me",go:()=>{name=genName();const i=$("#nm");if(i)i.value=name;else $("#nmshow").textContent=name}},
        {l:"Start the trip!",sub:`${MODES[BMODE].name} mode`,cls:"go",go:()=>{const i=$("#nm");let n=i?i.value.replace(/\s+/g," ").trim():name;
          if(i&&!okName(n)){n=genName();i.value=n;$("#err").textContent="Let's use this name instead!";sfx.bad();return}
          sfx.good();const b=Object.assign({},B);delete b._title;newGame(BMODE,b,n.slice(0,30));render()}},
        back("review")],{top:typing?`<div class="namebox"><input id="nm" maxlength="30" autocomplete="off" spellcheck="false" value="${esc(name)}" aria-label="Bill name"></div><div class="hintline">Use food words, not people's names. 30 letters max.</div><div class="err" id="err"></div>`:`<div class="note" id="nmshow">${esc(name)}</div>`});
      const i=$("#nm");if(i){i.onclick=e=>e.stopPropagation();i.onkeydown=e=>{e.stopPropagation();if(e.key==="Enter")document.querySelector('.dl.go').click()}}});
  }
}

function layout(){
  const bar=document.querySelector(".eb");const top=(bar?bar.offsetHeight:34)+6;
  const vw=document.documentElement.clientWidth,vh=window.innerHeight-top;
  const g=$("#game"),r=document.documentElement.style;
  g.classList.remove("side");
  if(vw/vh<1){r.setProperty("--W",vw+"px");r.setProperty("--u",(vw/320)+"px");r.setProperty("--P","auto");r.setProperty("--Pmin",Math.max(220,vh-vw*9/16)+"px")}
  else if(vh<520){const H=vh-6;const SW=Math.min(vw*0.6,H*16/9);const PW=Math.min(vw-SW-8,560);g.classList.add("side");
    r.setProperty("--W",(SW+PW+4)+"px");r.setProperty("--SW",SW+"px");r.setProperty("--PW",PW+"px");r.setProperty("--H",H+"px");r.setProperty("--u",Math.max(1.6,SW/320)+"px");r.setProperty("--P","auto");r.setProperty("--Pmin","0px")}
  else{const W=Math.min(vw-16,1280,vh/(0.5625+0.34));const P=Math.max(170,vh-W*0.5625-8);
    r.setProperty("--W",W+"px");r.setProperty("--u",(W/320)+"px");r.setProperty("--P",P+"px");r.setProperty("--Pmin","0px")}
}

   <circle cx="-6" cy="0" r="1.8"/><circle cx="6" cy="0" r="1.8"/><path d="M-6 9q6 5 12 0" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>${a}${hand}</g>`;
}

 case"committee":return`<rect width="360" height="190" fill="#e6d9c2"/><rect y="0" width="360" height="30" fill="#5a3a1a"/><path d="M0 120q180-60 360 0v30H0z" fill="#8b5a2b" stroke="#000" stroke-width="1.6"/><g fill="#fff8e0" stroke="#000">${[60,130,230,300].map(x=>`<rect x="${x-18}" y="${x<180?106-(180-x)*.05:106-(x-180)*.05}" width="36" height="9"/>`).join("")}</g><rect y="150" width="360" height="40" fill="#24548a"/><rect x="150" y="150" width="60" height="22" fill="#a0673e" stroke="#000"/>`;
 case"floor":return`<rect width="360" height="190" fill="#efe3c9"/><rect x="90" y="10" width="180" height="56" rx="4" fill="#1b2a1b" stroke="#000" stroke-width="2"/><text x="180" y="30" font-size="10" fill="#7dff7d" text-anchor="middle" font-family="monospace">YEA ▮▮▮▮▮▮▮  NAY ▮▮▮</text><text x="180" y="50" font-size="10" fill="#ffd34d" text-anchor="middle" font-family="monospace">H.R. ${S?S.num:"0000"}</text>${[0,1,2].map(r=>`<path d="M${0} ${120+r*22}q180 ${-30+r*4} 360 0" fill="none" stroke="#7b4a2a" stroke-width="12"/>`).join("")}<rect y="168" width="360" height="22" fill="#24548a"/>`;
 case"senate":return`<rect width="360" height="190" fill="#e9e1d1"/><path d="M0 0h360v40H0z" fill="#8a9bb0"/>${[...Array(12)].map((_,i)=>`<circle cx="${15+i*30}" cy="20" r="9" fill="#c9d3df" stroke="#000"/>`).join("")}<rect y="140" width="360" height="50" fill="#1f3a66"/>${[0,1].map(r=>`<path d="M0 ${134+r*18}q180 -28 360 0" fill="none" stroke="#8b5a2b" stroke-width="10"/>`).join("")}`;
 case"desk":return`<rect width="360" height="190" fill="#f4ecd8"/><path d="M120 20q60-30 120 0v90H120z" fill="#bcd7ef" stroke="#000" stroke-width="1.6"/><path d="M180 6v104M120 60h120" stroke="#000"/><path d="M40 30v90" stroke="#555" stroke-width="2"/><path d="M40 32h30v18H40z" fill="#c8102e"/><path d="M40 32h12v9H40z" fill="#24548a"/><path d="M300 30v90" stroke="#555" stroke-width="2"/><path d="M300 32h26v18h-26z" fill="#24548a"/><rect y="160" width="360" height="30" fill="#1f3a66"/><rect x="70" y="128" width="220" height="40" fill="#7b4a2a" stroke="#000" stroke-width="1.6"/><rect x="160" y="122" width="40" height="8" fill="#fff8e0" stroke="#000"/>`;
 case"drawer":return`<rect width="360" height="190" fill="#d9d2c3"/><rect x="60" y="20" width="240" height="170" fill="#8a8f96" stroke="#000" stroke-width="2"/>${[0,1,2].map(r=>`<rect x="74" y="${32+r*50}" width="212" height="40" fill="#a3a8ae" stroke="#000"/><rect x="164" y="${46+r*50}" width="32" height="8" rx="3" fill="#555"/>`).join("")}`;
 case"street":return`<rect width="360" height="190" fill="#9cc9f0"/><g stroke="#000" stroke-width="1.3"><rect x="10" y="50" width="70" height="110" fill="#e9b264"/><rect x="90" y="30" width="80" height="130" fill="#d7d0c4"/><rect x="190" y="60" width="60" height="100" fill="#c97b63"/><rect x="260" y="40" width="90" height="120" fill="#e3d6a8"/></g>${[...Array(12)].map((_,i)=>`<rect x="${20+(i%6)*55}" y="${70+Math.floor(i/6)*40}" width="14" height="16" fill="#fff8b0" stroke="#000"/>`).join("")}<rect y="160" width="360" height="30" fill="#777"/><path d="M0 175h360" stroke="#fff" stroke-dasharray="14 10" stroke-width="3"/>`;

function SCENEVEC(bg,who,mood,win){
  let s=`<svg viewBox="0 0 360 190" role="img" aria-label="" preserveAspectRatio="xMidYMid slice">${BG(bg)}`;
  if(bg==="hopper"&&who)s+=person(who,90,92,1.2)+billFig(170,98,1,mood);
  else if(bg==="drawer")s+=`<g transform="translate(180 90) rotate(-90)">${billFig(0,0,.9,"sleepy")}</g>`;
  else if(bg==="desk"&&who==="pres")s+=person("pres",180,106,1.1)+billFig(270,110,.8,mood);
  else if(bg==="desk")s+=billFig(180,92,1,mood);
  else if(bg==="capitol"&&!who)s+=billFig(70,140,1,mood)+person("kid",290,128,1);
  else if(bg==="stage")s+=billFig(180,96,1.1,"wow")+person("saucer",80,110,1)+person("kid",280,116,1);
  else{if(who&&who!=="kid")s+=person(who,100,118,1.25);if(who==="kid")s+=person("kid",100,124,1.3);s+=billFig(255,118,1,mood);if(win)s+=person("saucer",80,118,1)}
  return s+"</svg>"}


/* pixel art: files in art/, drawn over the room; anything missing falls back to the vector drawing */
const ART=new Set(["room-capitol","room-office","room-hopper","room-committee","room-house","room-senate","room-president","room-drawer","room-street","room-stage","food-pizza","food-pancakes","food-tacos","food-apples","food-curds","food-mac","food-pickles","food-broccoli","bill-happy","bill-worried","bill-sad","bill-sleepy","bill-wow","saucer","crust","green","sgreen","dente","gouda","topp","longwind","vp","chef","kid","clerk","reporter","blogger","pres"]);
const DIM={"bill-happy":[61,98],"bill-worried":[50,98],"bill-sad":[59,95],"bill-sleepy":[135,77],"bill-wow":[78,98],"saucer":[53,112],"crust":[158,112],"green":[131,112],"sgreen":[50,112],"dente":[116,112],"gouda":[90,112],"topp":[64,112],"longwind":[106,112],"vp":[92,112],"chef":[91,112],"kid":[77,90],"clerk":[69,112],"reporter":[96,112],"blogger":[65,112],"pres":[96,102]};
const ROOMART={capitol:"room-capitol",office:"room-office",hopper:"room-hopper",committee:"room-committee",floor:"room-house",senate:"room-senate",desk:"room-president",drawer:"room-drawer",street:"room-street",stage:"room-stage",hall:"room-hall",news:"room-news"};
const RALIAS={hall:"office",news:"capitol"};
for(const k in FOODICON)if(ART.has("food-"+k))FOODICON[k]=`<img class="pxi" src="art/food-${k}.png" alt="">`;
function spr(name,cx,h,o={}){const t=`translateX(-50%)${o.flip?" scaleX(-1)":""}${o.rot?` rotate(${o.rot}deg)`:""}`;
  return`<img class="spr" src="art/${name}.png" alt="" style="left:${cx}%;bottom:${o.b==null?5:o.b}%;height:${(h/180*100).toFixed(2)}%;transform:${t}">`}
function billSpr(mood,cx,o={}){let n="bill-"+mood;if(!ART.has(n))n=ART.has("bill-happy")?"bill-happy":ART.has("bill-3q")?"bill-3q":"bill-front";const flip=!o.noflip&&n!=="bill-front";const h=(DIM[n]?DIM[n][1]:96)*(o.s||1);const rot=mood==="sleepy"&&n!=="bill-sleepy"?-90:o.rot;return spr(n,cx,h,{flip,rot,b:o.b})}
function SCENE(bg,who,mood,win){
  let room=ROOMART[bg];if(!ART.has(room)&&RALIAS[bg])room=ROOMART[RALIAS[bg]];
  if(!room||!ART.has(room))return`<div class="px">${SCENEVEC(RALIAS[bg]&&bg!=="news"?RALIAS[bg]:bg==="news"?"capitol":bg,bg==="news"?"reporter":who,mood,win)}</div>`;
  let sp="",vec="";
  const P=(key,cx,sx,sy,s=1.25)=>{if(ART.has(key))sp+=spr(key,cx,(DIM[key]?DIM[key][1]:110)*(s/1.25));else vec+=person(key,sx,sy+6,s*.8)};
  if(bg==="hopper"&&who){P(who,25,90,92,1.2);sp+=billSpr(mood,50)}
  else if(bg==="drawer")sp+=billSpr("sleepy",71,{b:37,s:.6});
  else if(bg==="desk"&&who==="pres"){P("pres",50,180,106,1.1);sp+=billSpr(mood,76,{s:.85})}
  else if(bg==="desk")sp+=billSpr(mood,50);
  else if(bg==="capitol"&&!who){sp+=billSpr(mood,26,{s:1.1,noflip:true});if(ART.has("kid"))sp+=spr("kid",80,DIM.kid?DIM.kid[1]:88)}
  else if(bg==="news")P("reporter",26,100,118,1.25);
  else if(bg==="stage"){sp+=billSpr("wow",50,{s:1.1});P("saucer",22,80,110,1);if(ART.has("kid"))sp+=spr("kid",80,DIM.kid?DIM.kid[1]:88)}
  else{if(who)P(who,27,100,who==="kid"?124:118,who==="kid"?1.3:1.25);sp+=billSpr(mood,72);if(win)P("saucer",20,80,118,1)}
  return`<div class="px"><img class="room" src="art/${room}.png" alt="">${vec?`<svg class="ov" viewBox="0 0 360 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${vec}</svg>`:""}${sp}</div>`}
