:root{color-scheme:light dark;
  --d1:light-dark(#6f78bf,#2b3060);--d2:light-dark(#7d86cc,#333a6e);
  --plat:#e6e6e6;--panel:#ffffff;--ink:#111;--hi:#fff;--lo:#8a8a8a;--sel:#2a2aa8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",Verdana,sans-serif;overflow-x:clip;
  background:repeating-conic-gradient(var(--d1) 0 25%,var(--d2) 0 50%) 0 0/4px 4px;background-attachment:fixed}
.sys{font-family:"EduChicago","Chicago","Charcoal",Geneva,Verdana,sans-serif;font-weight:400;-webkit-font-smoothing:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--sel);outline-offset:2px}

/* menu bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;height:34px;background:#fff;color:#111;border-bottom:1px solid #000;padding:0 6px}
.mi{position:relative}
.mt{background:none;border:0;height:34px;padding:0 12px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.mt[aria-expanded=true]{background:#111;color:#fff}
.dd{position:absolute;left:0;top:34px;min-width:220px;background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #000;padding:3px 0;display:none}
.mt[aria-expanded=true]+.dd{display:block}
.dd button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:8px 16px;font-size:15px;cursor:pointer;min-height:40px;align-items:center}
.dd button:hover,.dd button:focus-visible{background:#111;color:#fff;outline:0}
.dd hr{border:0;border-top:1px dotted #777;margin:4px 0}
.clock{margin-left:auto;padding:0 10px;font-size:15px;white-space:nowrap}

/* desktop */
.desk{max-width:1240px;margin:0 auto;padding:clamp(18px,4vw,48px) max(3vw,12px) 40px;position:relative}
.win{max-width:820px;margin:0 auto;background:var(--plat);border:1px solid #000;box-shadow:1px 1px 0 #000}
.tb{position:relative;height:28px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #000;
  background:repeating-linear-gradient(var(--plat) 0 3px,#8d8d8d 3px 4px);background-clip:content-box;padding:5px 4px}
.tb h1{margin:0;font-size:15px;font-weight:400;background:var(--plat);padding:0 12px;line-height:20px}
.close{position:absolute;left:10px;top:6px;width:16px;height:16px;background:var(--plat);border:1px solid #000}
.inner{padding:14px 14px 0}
.hello{display:flex;align-items:center;gap:14px;margin:2px 4px 14px}
.hello p{margin:0;font-size:clamp(17px,2.2vw,20px);font-weight:700;text-wrap:balance}
.hello small{display:block;font-weight:400;font-size:15px;color:#333}
.tabs{display:flex;gap:4px;padding-left:10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:1px solid #000;border-bottom:0;border-radius:7px 7px 0 0;background:#cfcfcf;padding:8px 18px 7px;font-size:15px;cursor:pointer;min-height:42px;position:relative;top:1px}
.tab[aria-selected=true]{background:var(--panel);z-index:1;padding-bottom:8px}
.panel{background:var(--panel);border:1px solid #000;min-height:300px;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;align-content:start}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#111;background:#fff;border:1px solid #000;border-radius:12px;
  padding:16px 10px 14px;box-shadow:1px 1px 0 #000;cursor:pointer;text-align:center}
.tile:hover{box-shadow:2px 2px 0 #000}
.tile:active,.tile.down{background:#111;color:#fff;box-shadow:none}
.tile.down svg,.tile:active svg{filter:invert(1)}
.tile.back b{background:#111;color:#fff;padding:1px 6px}
.tile svg{width:80px;height:80px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.tile b{font:400 15px/1.25 "EduChicago","Chicago",Geneva,sans-serif;-webkit-font-smoothing:none}
.tile span{font-size:14px;color:inherit;opacity:.8}
.tile.soon svg{filter:grayscale(1);opacity:.5}
.tile.soon b{color:#555}
.tag{font-family:"EduChicago",Geneva,sans-serif;font-size:13px;background:#fff;border:1px solid #000;border-radius:10px;padding:1px 8px}
.empty{grid-column:1/-1;text-align:center;color:#444;padding:40px 0}
.status{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;font-size:15px;border-top:1px solid #000;margin-top:14px;background:var(--plat)}
.status #hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .n{white-space:nowrap;color:#333}

/* desktop icons */
.icons{position:absolute;right:max(3vw,12px);top:clamp(18px,4vw,48px);display:flex;flex-direction:column;gap:22px}
.di{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:132px;cursor:pointer;padding:6px}
.di svg{width:48px;height:48px}
.di span{background:#fff;color:#111;font-size:14px;padding:1px 6px;line-height:1.3}
.di:focus-visible span,.di:hover span{background:#111;color:#fff}
@media(max-width:1179px){.icons{position:static;flex-direction:row;justify-content:center;margin-top:26px}}

/* dialog */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.veil.on{display:flex}
.dlg{background:#fff;color:#111;border:1px solid #000;box-shadow:1px 1px 0 #000;padding:5px;max-width:460px;width:100%}
.dlg-in{border:3px solid #000;padding:20px;display:grid;grid-template-columns:56px 1fr;gap:16px}
.dlg h2{margin:0 0 8px;font-size:17px;font-weight:400}
.dlg p{margin:0 0 10px}
.dlg ul{margin:0 0 10px;padding-left:20px}
.ok{grid-column:1/-1;justify-self:end;border:3px solid #000;border-radius:14px;padding:3px}
.ok button{background:#fff;border:1px solid #000;border-radius:9px;padding:6px 28px;font-size:15px;cursor:pointer;min-height:40px}
.ok button:active{background:#111;color:#fff}

.zoom{position:fixed;border:1px solid #000;pointer-events:none;z-index:50;outline:1px solid #fff}
@media(max-width:600px){
  .panel{padding:14px;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile svg{width:64px;height:64px}.tile b{font-size:14px}.tile span:not(.tag){display:none}
  .hello svg{display:none}.clock{display:none}.inner{padding:10px 8px 0}.tab{padding:8px 11px 7px;font-size:14px}
  .status .n{display:none}
}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}

/* startup screen: plays on the first visit, and from Special > Restart */
.boot{position:fixed;inset:0;z-index:100;background:repeating-conic-gradient(#999 0 25%,#b3b3b3 0 50%) 0 0/4px 4px;cursor:pointer;color:#111}
.boot[hidden],.boot [hidden]{display:none}
.boot.out{opacity:0;transition:opacity .25s}
.bk-face{position:absolute;inset:0;display:grid;place-items:center}
.bk-face svg{width:104px;height:104px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}
.bk-mid{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.bk-box{background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #000;padding:4px;width:min(380px,100%)}
.bk-in{border:2px solid #000;padding:20px 22px 22px;text-align:center}
.bk-in svg{width:44px;height:44px;display:block;margin:0 auto 10px}
.bk-t{font-size:18px;margin-bottom:16px}
.bk-bar{height:14px;border:1px solid #000;background:#fff;text-align:left}
.bk-bar i{display:block;height:100%;width:0;background:#3a3a8a}
.bk-ext{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:70vw}
.bk-ext svg{width:40px;height:40px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.3))}
.bk-skip{position:absolute;right:12px;bottom:14px;font-size:13px}
@media(max-width:600px){.bk-skip{left:12px;right:auto;bottom:62px}}
</style>
</head>

<div class="boot" id="boot" hidden aria-hidden="true">
  <div class="bk-face" id="bkFace"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#3a7bd5" stroke="#000"/><path d="M7 8c3-1 5 1 4 4s-4 2-5 5 2 6 5 7M21 6c-1 3 2 4 5 3M19 17c2-1 5 0 5 3s-2 4-4 4" fill="none" stroke="#4fc14f" stroke-width="3.4" stroke-linecap="round"/><circle cx="12.5" cy="13.5" r="1.6" fill="#111"/><circle cx="19.5" cy="13.5" r="1.6" fill="#111"/><path d="M11 18.5q5 4.5 10 0" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  <div class="bk-mid" id="bkMid" hidden><div class="bk-box"><div class="bk-in"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#3a7bd5" stroke="#000"/><path d="M4 4.5c1.5-.5 2.5.5 2 2s-2 1-2.5 2.5S5 12 6.5 12.5M10 3.5c-.5 1.5 1 2 2.5 1.5M9.5 9c1-.5 2.5 0 2.5 1.5s-1 2-2 2" fill="none" stroke="#4fc14f" stroke-width="2" stroke-linecap="round"/></svg><div class="bk-t sys">Welcome to edutain.fun</div><div class="bk-bar"><i id="bkBar"></i></div></div></div></div>
  <div class="bk-ext" id="bkExt"></div>
  <div class="bk-skip sys" id="bkSkip" hidden>Click anywhere to skip</div>
</div>
<nav class="bar sys" aria-label="Menu bar">
  <div class="mi">
    <button class="mt" aria-expanded="false" aria-haspopup="true" aria-label="edutain.fun menu">
      <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#3a7bd5" stroke="#000"/><path d="M4 4.5c1.5-.5 2.5.5 2 2s-2 1-2.5 2.5S5 12 6.5 12.5M10 3.5c-.5 1.5 1 2 2.5 1.5M9.5 9c1-.5 2.5 0 2.5 1.5s-1 2-2 2" fill="none" stroke="#4fc14f" stroke-width="2" stroke-linecap="round"/></svg>
      <span>edutain.fun</span>
    </button>
    <div class="dd" role="menu">
      <button role="menuitem" data-do="about">About edutain.fun…</button>
      <button role="menuitem" data-do="grown">For Grown-Ups…</button>
    </div>
  </div>
  <div class="mi">
    <button class="mt" aria-expanded="false" aria-haspopup="true">Special</button>
    <div class="dd" role="menu">
            <button role="menuitem" data-do="all">Show All Games</button>
      <hr>
      <button role="menuitem" data-do="restart">Restart</button>
    </div>
  </div>
  <div class="clock" id="clock" aria-hidden="true"></div>
</nav>

<main class="desk">
  <section class="win" aria-labelledby="wt">
    <div class="tb"><span class="close" aria-hidden="true"></span><h1 id="wt" class="sys">edutain.fun</h1></div>
    <div class="inner">
      <div class="hello">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="4" width="26" height="19" rx="2" fill="#e8e3d0" stroke="#000"/><rect x="6" y="7" width="20" height="13" fill="#2f8b8b" stroke="#000"/><path d="M11 12h1m8 0h1M12 16q4 3 8 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="8" y="23" width="16" height="5" fill="#d4ceb8" stroke="#000"/><rect x="18" y="25" width="4" height="1" fill="#000"/></svg>
        <p>Hi! Pick a game to play.<small>Games about maps, history, and how our country works.</small></p>
      </div>
      <div class="tabs sys" role="tablist" id="tabs"></div>
      <div class="panel" role="tabpanel" id="panel" aria-labelledby=""></div>
    </div>
    <div class="status"><span id="hint">Click a button to start a game.</span><span class="n" id="count"></span></div>
  </section>

  <div class="icons">
    <button class="di" data-do="grown">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3h13l6 6v20H7z" fill="#fff" stroke="#000"/><path d="M20 3v6h6" fill="#ddd" stroke="#000"/><path d="M10 13h12M10 17h12M10 21h9M10 25h11" stroke="#555"/></svg>
      <span class="sys">For Grown-Ups</span>
    </button>
    <button class="di" data-do="about">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6h24v16H14l-6 6v-6H4z" fill="#ffe680" stroke="#000"/><text x="16" y="19" text-anchor="middle" font-size="13" font-weight="700" font-family="Verdana,sans-serif">?</text></svg>
      <span class="sys">About</span>
    </button>
  </div>
</main>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="dt">
  <div class="dlg"><div class="dlg-in">
    <div id="dicon"></div>
    <div><h2 id="dt" class="sys"></h2><div id="db"></div></div>
    <div class="ok"><button id="okb" class="sys">OK</button></div>
  </div></div>
</div>

<script>
{
/* ---- Games. To add one, add a line here. On the live site, set url to the game's page, e.g. "/mixed-up-map/". ---- */
const GAMES=[
  {id:"map",title:"Mixed-Up Map",tab:"Maps",blurb:"The state names got mixed up! Swap them back to the right places.",url:"map/",icon:"map"},
  {id:"gallery",title:"A Puzzling Presidential Gallery",tab:"History",blurb:"Some signs under the presidents are wrong. Find them and fix them.",url:"gallery/",icon:"gallery"},
  {id:"first",title:"Which Came First?",tab:"History",blurb:"Put picture cards in order and build your own timeline of history.",url:"first/",icon:"first"},
  {id:"chase",title:"The Big Map Chase",tab:"Maps",blurb:"A sneaky thief is hiding! Find the places on the map before time runs out.",url:"chase/",icon:"chase"},
  {id:"bill",title:"Bill's Big Trip",tab:"Government",blurb:"Help a silly food bill travel through Congress and become a law.",url:"bill/",icon:"bill"}
];
const TABS=["All Games","Maps","History","Government"];

const ICONS={
first:`<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="11" height="15" rx="1.5" fill="#fff" stroke="#000" transform="rotate(-10 7 16)"/><rect x="10.5" y="7" width="11" height="15" rx="1.5" fill="#ffe14d" stroke="#000"/><rect x="19" y="9" width="11" height="15" rx="1.5" fill="#fff" stroke="#000" transform="rotate(10 25 16)"/><path d="M16 11v7M14.5 12.5l1.5-1.5" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M3 28h26" stroke="#000" stroke-width="1.5"/><path d="M26 26l3 2-3 2" fill="none" stroke="#000" stroke-width="1.5"/></svg>`,
chase:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 9a12 12 0 0 1 4-5M28 9a12 12 0 0 0-4-5M2 15h3M27 15h3" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/><path d="M8 24v-9a8 8 0 0 1 16 0v9z" fill="#e8322b" stroke="#000"/><path d="M12 15a4 4 0 0 1 4-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="5" y="24" width="22" height="5" rx="1" fill="#555" stroke="#000"/></svg>`,
map:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 9l9-3v21l-9 3z" fill="#7cc65a" stroke="#000"/><path d="M11 6l10 3v21l-10-3z" fill="#f5e07a" stroke="#000"/><path d="M21 9l9-3v21l-9 3z" fill="#6fb2ff" stroke="#000"/><path d="M4 22q5-4 9-1t9-2 7-5" fill="none" stroke="#d33" stroke-width="1.4" stroke-dasharray="2 1.6"/><path d="M16 17l-3-5a3.4 3.4 0 1 1 6 0z" fill="#e33" stroke="#000"/><circle cx="16" cy="10.6" r="1.2" fill="#fff"/></svg>`,
gallery:`<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="2.5" width="24" height="27" fill="#d9a43a" stroke="#000"/><rect x="6" y="4.5" width="20" height="23" fill="#b9821f"/><rect x="8" y="6.5" width="16" height="17" fill="#9cc3ee" stroke="#000"/><path d="M10.5 23.5q5.5-8 11 0z" fill="#333"/><circle cx="16" cy="13.5" r="3.6" fill="#f0c49c" stroke="#000" stroke-width=".8"/><path d="M12.6 12.4q3.4-4 6.8 0" fill="#7a5130"/><rect x="12" y="24.6" width="8" height="2" fill="#fff3c4" stroke="#000" stroke-width=".6"/></svg>`,
bill:`<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="5" width="18" height="21" fill="#fff8e0" stroke="#000"/><rect x="5" y="3" width="22" height="4" rx="2" fill="#e6d49c" stroke="#000"/><rect x="5" y="24" width="22" height="4" rx="2" fill="#e6d49c" stroke="#000"/><path d="M10 11h12M10 14h12M10 17h8" stroke="#666"/><path d="M12 28v2.5h-2M20 28v2.5h2" stroke="#000" stroke-width="1.5" fill="none"/><circle cx="20" cy="20" r="2.6" fill="#d33" stroke="#000" stroke-width=".8"/></svg>`
};
const ALERT={
info:`<svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6h24v16H14l-6 6v-6H4z" fill="#ffe680" stroke="#000"/><text x="16" y="19" text-anchor="middle" font-size="13" font-weight="700" font-family="Verdana,sans-serif">!</text></svg>`,
soon:`<svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="2" width="20" height="28" rx="2" fill="#fff" stroke="#000"/><path d="M10 6h12v4l-6 6-6-6zM10 26h12v-4l-6-6-6 6z" fill="#f5e07a" stroke="#000"/></svg>`
};

const $=s=>document.querySelector(s);
const tabsEl=$("#tabs"),panel=$("#panel"),hint=$("#hint"),count=$("#count");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cur=TABS.includes(store.get("ef-tab"))?store.get("ef-tab"):TABS[0];
const DEFAULT_HINT="Click a button to start a game.";

/* sounds removed from the launcher */
function blip(){}

function drawTabs(){
  tabsEl.innerHTML=TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.replace(/\W/g,"")}" aria-selected="${t===cur}" tabindex="${t===cur?0:-1}">${t}</button>`).join("");
}
function drawPanel(){
  const list=GAMES.filter(g=>cur===TABS[0]||g.tab===cur);
  panel.setAttribute("aria-labelledby","tab-"+cur.replace(/\W/g,""));
  panel.innerHTML=list.length?list.map(g=>g.soon
    ?`<button class="tile soon" data-id="${g.id}" data-blurb="${g.blurb} Coming soon!">${ICONS[g.icon]}<b>${g.title}</b><span class="tag">Coming soon</span></button>`
    :`<a class="tile" href="${g.url}" data-id="${g.id}" data-blurb="${g.blurb}">${ICONS[g.icon]}<b>${g.title}</b><span>${g.tab}</span></a>`).join("")
    :`<p class="empty">No games here yet. More are coming!</p>`;
  const ready=list.filter(g=>!g.soon).length;
  count.textContent=ready===1?"1 game":ready+" games";
}
function pick(t){cur=t;store.set("ef-tab",t);drawTabs();drawPanel();hint.textContent=DEFAULT_HINT}

tabsEl.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b&&b.textContent!==cur){blip(520);pick(b.textContent)}});
tabsEl.addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const i=(TABS.indexOf(cur)+(e.key==="ArrowRight"?1:TABS.length-1))%TABS.length;
  pick(TABS[i]);tabsEl.children[i].focus();
});

/* hover / focus shows the blurb in the status bar */
const show=e=>{const t=e.target.closest(".tile");if(t)hint.textContent=t.dataset.blurb};
const hide=e=>{if(e.target.closest(".tile"))hint.textContent=DEFAULT_HINT};
panel.addEventListener("mouseover",show);panel.addEventListener("focusin",show);
panel.addEventListener("mouseout",hide);panel.addEventListener("focusout",hide);

/* open a game with the classic zoom-open rectangles */
let going=false;
panel.addEventListener("click",e=>{
  const t=e.target.closest(".tile");if(!t)return;
  const g=GAMES.find(x=>x.id===t.dataset.id);
  if(g.soon){blip(330,.12);dialog("soon",g.title,`<p>This game is still being built.</p><p>${g.blurb} Check back soon!</p>`);return}
  if(t.dataset.go){delete t.dataset.go;return}
  e.preventDefault();if(going)return;going=true;blip(880);
  t.classList.add("down");hint.textContent="Opening "+g.title+"…";
  const done=()=>{t.classList.remove("down");going=false;t.dataset.go="1";t.click();setTimeout(()=>hint.textContent=DEFAULT_HINT,800)};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return setTimeout(done,120);
  const a=t.getBoundingClientRect(),W=innerWidth,H=innerHeight,N=7,boxes=[];
  for(let i=1;i<=N;i++)setTimeout(()=>{
    const p=i/N,z=document.createElement("div");z.className="zoom";
    Object.assign(z.style,{left:a.left*(1-p)+"px",top:a.top*(1-p)+"px",width:a.width+(W-a.width)*p+"px",height:a.height+(H-a.height)*p+"px"});
    document.body.appendChild(z);boxes.push(z);if(boxes.length>3)boxes.shift().remove();
    if(i===N)setTimeout(()=>{boxes.forEach(b=>b.remove());done()},60);
  },i*38);
});

/* menus */
const closeMenus=()=>document.querySelectorAll(".mt").forEach(m=>m.setAttribute("aria-expanded","false"));
document.querySelectorAll(".mt").forEach(m=>m.addEventListener("click",e=>{
  e.stopPropagation();const open=m.getAttribute("aria-expanded")==="true";closeMenus();
  if(!open){m.setAttribute("aria-expanded","true");blip(740,.03)}
}));
document.addEventListener("click",closeMenus);

/* dialogs */
const veil=$("#veil"),okb=$("#okb");let back=null;
const TEXT={
  about:["About edutain.fun",`<p><b>edutain.fun</b> has free games about people, places, and the past.</p><p>Every game teaches something true. When you get one right, you unlock a real story!</p><p>Made in Madison, Wisconsin.</p>`],
  grown:["For Grown-Ups",`<p>These games are made for kids in about 3rd to 5th grade, and they are fun for the whole family.</p><ul><li>Free. No sign-up or login.</li><li>No timers, unless you choose one. Mistakes teach instead of punish.</li><li>Works on phones, tablets, and computers.</li></ul><p>Every fact is checked against a solid source before a game goes up. When historians disagree, the game says so.</p>`]
};
function dialog(kind,title,body){
  back=document.activeElement;
  $("#dicon").innerHTML=ALERT[kind==="soon"?"soon":"info"];$("#dt").textContent=title;$("#db").innerHTML=body;
  veil.classList.add("on");okb.focus();
}
function closeDialog(){veil.classList.remove("on");blip(600,.03);if(back&&back.focus)back.focus()}
okb.addEventListener("click",closeDialog);
veil.addEventListener("click",e=>{if(e.target===veil)closeDialog()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenus();if(veil.classList.contains("on"))closeDialog()}});

function act(what){
  if(what==="about"||what==="grown"){blip();dialog("info",...TEXT[what])}
  if(what==="all"){blip(520);pick(TABS[0])}
  if(what==="restart")boot(true);
}
document.querySelectorAll("[data-do]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();closeMenus();act(b.dataset.do)}));

/* clock */
const tick=()=>{$("#clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})};
tick();setInterval(tick,15000);

/* coming back from a game (#map, #gallery): show its tile and play the zoom-shut into it */
const ret=GAMES.find(g=>"#"+g.id===location.hash&&!g.soon);
if(ret&&cur!==TABS[0]&&ret.tab!==cur)cur=TABS[0];
drawTabs();drawPanel();
if(ret){
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  const t=panel.querySelector('[data-id="'+ret.id+'"]');
  if(t){
    t.classList.add("back");hint.textContent=ret.blurb;
    const clear=()=>t.classList.remove("back");
    panel.addEventListener("click",clear,{once:true});
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
      const a=t.getBoundingClientRect(),W=innerWidth,H=innerHeight,N=7,boxes=[];
      for(let i=0;i<N;i++)setTimeout(()=>{
        const p=i/(N-1),z=document.createElement("div");z.className="zoom";
        Object.assign(z.style,{left:a.left*p+"px",top:a.top*p+"px",width:W+(a.width-W)*p+"px",height:H+(a.height-H)*p+"px"});
        document.body.appendChild(z);boxes.push(z);if(boxes.length>3)boxes.shift().remove();
        if(i===N-1)setTimeout(()=>boxes.forEach(b=>b.remove()),80);
      },i*38);
    }
  }
}

/* startup screen: first visit only (skipped when coming back from a game or with reduced motion); Special > Restart replays it */
function chime(){}
function boot(force){
  const bt=$("#boot");
  if(!force&&(store.get("ef-booted")||ret||matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  store.set("ef-booted","1");
  const face=$("#bkFace"),mid=$("#bkMid"),bar=$("#bkBar"),ext=$("#bkExt"),skip=$("#bkSkip");
  bt.classList.remove("out");bt.hidden=false;face.hidden=false;mid.hidden=true;skip.hidden=true;ext.innerHTML="";bar.style.width="0";
  if(force)chime();
  const timers=[];let over=false;
  const at=(ms,f)=>timers.push(setTimeout(f,ms));
  const end=()=>{if(over)return;over=true;timers.forEach(clearTimeout);bt.classList.add("out");setTimeout(()=>{bt.hidden=true;bt.classList.remove("out")},260);bt.removeEventListener("click",end);document.removeEventListener("keydown",end)};
  bt.addEventListener("click",end);document.addEventListener("keydown",end);
  at(800,()=>{face.hidden=true;mid.hidden=false;skip.hidden=false});
  for(let s=1;s<=10;s++)at(800+s*160,()=>{bar.style.width=s*10+"%"});
  GAMES.forEach((g,i)=>at(1100+i*280,()=>{ext.insertAdjacentHTML("beforeend",ICONS[g.icon]);blip(500+i*120,.04)}));
  at(2700,end);
}
boot(false);
}
</script>
</body>
</html>
